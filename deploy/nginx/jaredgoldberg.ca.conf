server {
    listen 80;
    listen [::]:80;

    server_name jaredgoldberg.ca www.jaredgoldberg.ca;

    return 301 https://jaredgoldberg.ca$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.jaredgoldberg.ca;

    ssl_certificate /etc/letsencrypt/live/jaredgoldberg.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaredgoldberg.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jaredgoldberg.ca$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name jaredgoldberg.ca;

    root /var/www/jaredgoldberg.ca/public_html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/jaredgoldberg.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaredgoldberg.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
        root /var/www/jaredgoldberg.ca/public_html;
    }

    location = /essays/art.html { return 410; }
    location = /essays/food { return 410; }
    location ^~ /essays/food/ { return 410; }
    location = /photography { return 410; }
    location ^~ /photography/ { return 410; }
    location = /media { return 410; }
    location ^~ /media/ { return 410; }
    location = /food { return 410; }
    location ^~ /food/ { return 410; }
    location = /art.html { return 410; }

    location / {
        # Redirect old /essays/ URLs to new clean URLs
        rewrite ^/essays/index\.html$ /about/ permanent;
        rewrite ^/essays/$ /about/ permanent;
        rewrite ^/essays/systems/index\.html$ /work/ permanent;
        rewrite ^/essays/systems/$ /work/ permanent;
        rewrite ^/essays/dm\.html$ /contact/ permanent;
        rewrite ^/essays/writing/index\.html$ /writing/ permanent;
        rewrite ^/essays/community/the-money-club\.html$ /projects/the-money-club/ permanent;
        rewrite ^/essays/community/capital-works\.html$ /projects/capital-works/ permanent;

        # Work subpages
        rewrite ^/essays/systems/loblaw\.html$ /work/loblaw.html permanent;
        rewrite ^/essays/systems/walmart\.html$ /work/walmart.html permanent;
        rewrite ^/essays/systems/canadian-tire\.html$ /work/canadian-tire.html permanent;
        rewrite ^/essays/systems/china\.html$ /work/china.html permanent;

        # Essay pages - redirect to clean /writing/ URLs
        rewrite ^/essays/writing/what-do-the-wealthy\.html$ /writing/what-do-the-wealthy/ permanent;
        rewrite ^/essays/writing/baseball-bats\.html$ /writing/baseball-bats/ permanent;
        rewrite ^/essays/writing/medium-is-the-message\.html$ /writing/medium-is-the-message/ permanent;
        rewrite ^/essays/writing/we-behave-like-ants\.html$ /writing/we-behave-like-ants/ permanent;
        rewrite ^/essays/writing/what-does-it-all-mean\.html$ /writing/what-does-it-all-mean/ permanent;
        rewrite ^/essays/writing/if-luck-is-structural\.html$ /writing/if-luck-is-structural/ permanent;
        rewrite ^/essays/writing/civic-design-failure\.html$ /writing/civic-design-failure/ permanent;
        rewrite ^/essays/writing/compounding-bad-luck\.html$ /writing/compounding-bad-luck/ permanent;
        rewrite ^/essays/writing/real-systems-incentives\.html$ /writing/real-systems-incentives/ permanent;
        rewrite ^/essays/writing/building-infrastructure\.html$ /writing/building-infrastructure/ permanent;
        rewrite ^/essays/writing/the-misaligned-compass\.html$ /writing/the-misaligned-compass/ permanent;
        rewrite ^/essays/writing/debt-slavery-treasury\.html$ /writing/debt-slavery-treasury/ permanent;
        rewrite ^/essays/writing/why-roman-law-still-runs-the-world\.html$ /writing/why-roman-law-still-runs-the-world/ permanent;

        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
